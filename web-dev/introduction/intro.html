<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>introduction</title>
  <!-- <link rel="stylesheet" href="intro.css"> -->
  <style>
    * {
      padding: 0;
      margin: 0;
    }
    body {
      background-color: #0d1835;
      justify-content: center;
      height: 100vh;
      width: 100%;
    }
    header {
      height: 16vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    main {
      display: flex;
      height: 64vh;
      width: 100%;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    footer {
      display: flex;
      height: 12vh;
      width: 100%;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    footer a {
      color: #beccee;
    }
    .top {
      display: flex;
      flex-direction: column;
      height: 16vh;
      width: 100%;
      align-items: center;
      justify-content: center;
      color: #beccee;
      font-size: 1.5rem;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }
    .skills {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #beccee;
      margin: 0.5rem 1rem;
      padding: 0.25rem 2rem;
      height: 12rem;
      width: 100%;
      font-size: 1.5rem;
      font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    }
    .picture {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      margin: 0.5rem 0;
      font-size: 1.2rem;
      color: rgb(157, 220, 227);
    }
    .picture img {
      height: 20rem;
      width: 20rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1>Tanmay Bahule</h1>
      <h2>about me</h2>
      <p>im a student currently studying BCA</p>
    </div>
  </header>
  <main>
    <section class="skills">
      <ul>
        <ol>my skills: </ol>
        <ol>1. C/C++, Java, Python</ol>
        <ol>2. html, css</ol>
        <ol>3. postgresql, </ol>
      </ul>
    </section>
    <section class="picture">
      <p><b>an image:</b></p> 
      <img src="/images/death.jpg" alt="death-img" class="img0">
      <br>
    </section>
  </main>
  <footer>
    <a href="https://www.linkedin.com/in/tanmay-bahule/?isSelfProfile=true" target="_blank">
      <h3>link to my linkedIn</h3>
    </a>
  </footer>
</body>
</html>
