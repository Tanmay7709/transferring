<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProductCard</title>
  <link rel="stylesheet" href="productCard.css">
</head>
<body>
  <main>
    <section class="container">
      <article class="product-card">
        <div class="title">
          <span>SALE</span>
          <img src="/images/markers.jpg" alt="markers">
        </div>
      
        <div class="properties">
          <h2 class="product-name">
            Quality Markers
          </h2>
  
          <p>Great markers made with care and some machinery. keep the lid on after using the markers for long term usage.</p>
          <p>PRICE : 20$</p>
          <p>DISCOUNT : 2$</p>
          
          <button>BUY NOW!</button>
        </div>
      </article>
      
    </section>
  </main>
</body>
</html>
