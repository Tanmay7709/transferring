<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quton - Prototype</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: 'var(--color-bg)',
                            surface: 'var(--color-surface)',
                            primary: 'var(--color-primary)',
                            text: 'var(--color-text)',
                            muted: 'var(--color-text-muted)',
                            border: 'var(--color-border)',
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'float': '0 -10px 40px -10px rgba(0,0,0,0.1)',
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="quton.css">
    <script type="text/javascript" src="quton.js" ></script>
</head>
<body class="antialiased flex items-center justify-center min-h-screen">

    <!-- Mobile App Container -->
    <div id="app-container" data-theme="root" class="relative w-full max-w-md h-[100dvh] md:h-[90vh] md:rounded-[2.5rem] md:shadow-2xl overflow-hidden bg-brand-bg transition-colors duration-300 border-x md:border-y md:border-8 border-gray-900 flex flex-col">
        
        <!-- Header -->
        <header class="bg-brand-surface pt-10 pb-4 px-6 shadow-soft z-10 transition-colors duration-300 rounded-b-2xl relative">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <h1 class="text-2xl font-bold text-brand-text">The Grand Bistro</h1>
                    <p class="text-xs text-brand-muted font-medium tracking-wide uppercase mt-1">Table 12</p>
                </div>
                <!-- Theme Switcher -->
                <button onclick="toggleTheme()" class="p-2 rounded-full bg-brand-bg text-brand-text border border-brand-border shadow-sm active:scale-95 transition-transform" aria-label="Change Theme">
                    <i class="ph ph-palette text-xl"></i>
                </button>
            </div>
            
            <!-- Category Navigation -->
            <div class="flex space-x-4 mt-6 overflow-x-auto pb-2" id="category-nav">
                <!-- Populated by JS -->
            </div>
        </header>

        <!-- Main Scrollable Content -->
        <main class="flex-1 overflow-y-auto pb-28 px-4 pt-4 scroll-smooth">
            
            <!-- Ad Banner Space (Secondary Revenue) -->
            <div class="mb-6 bg-brand-surface rounded-2xl p-4 flex items-center shadow-sm border border-brand-border relative overflow-hidden group cursor-pointer active:scale-[0.98] transition-transform">
                <div class="absolute top-0 right-0 bg-brand-border text-[10px] uppercase font-bold px-2 py-1 rounded-bl-lg text-brand-muted">Sponsored</div>
                <img src="https://placehold.co/80x80/2ecc71/ffffff?text=Aqua" alt="Ad" class="w-12 h-12 rounded-full object-cover mr-4">
                <div>
                    <h4 class="text-sm font-bold text-brand-text">Fiora Sparkling Water</h4>
                    <p class="text-xs text-brand-muted mt-0.5">Refresh your palate. Order now.</p>
                </div>
            </div>

            <!-- Menu Content -->
            <div id="menu-content" class="space-y-8">
                <!-- Populated by JS -->
            </div>
            
            <!-- Spacer for bottom bar -->
            <div class="h-10"></div>
        </main>

        <!-- Silent Staff Alert (Sticky Bottom Bar) -->
        <div class="absolute bottom-0 left-0 w-full bg-brand-surface/90 backdrop-blur-md shadow-float border-t border-brand-border rounded-t-3xl px-4 py-5 pb-8 md:pb-5 transition-colors duration-300 z-20">
            <div class="flex justify-between items-center max-w-sm mx-auto">
                <button onclick="triggerAlert('Waiter Called', 'A staff member is on the way.')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform w-1/3">
                    <div class="w-12 h-12 rounded-full bg-brand-bg border border-brand-border flex items-center justify-center text-brand-text shadow-sm">
                        <i class="ph ph-bell text-2xl"></i>
                    </div>
                    <span class="text-[11px] font-semibold text-brand-text">Call Waiter</span>
                </button>
                
                <button onclick="triggerAlert('Water Requested', 'We are bringing fresh water.')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform w-1/3">
                    <div class="w-12 h-12 rounded-full bg-brand-bg border border-brand-border flex items-center justify-center text-brand-text shadow-sm">
                        <i class="ph ph-drop text-2xl"></i>
                    </div>
                    <span class="text-[11px] font-semibold text-brand-text">Water</span>
                </button>
                
                <button onclick="triggerAlert('Bill Requested', 'Preparing your check now.')" class="flex flex-col items-center gap-1.5 active:scale-90 transition-transform w-1/3">
                    <div class="w-12 h-12 rounded-full bg-brand-primary text-brand-surface flex items-center justify-center shadow-md">
                        <i class="ph ph-receipt text-2xl"></i>
                    </div>
                    <span class="text-[11px] font-semibold text-brand-text">Pay Bill</span>
                </button>
            </div>
        </div>

        <!-- Toast Notification Container -->
        <div id="toast-container" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-[90%] max-w-[350px] pointer-events-none"></div>

    </div>

    <script>
    </script>
</body>
</html>
